services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ohlcv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohlcv}
      POSTGRES_DB: ohlcv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohlcv -d ohlcv"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ohlcv:${POSTGRES_PASSWORD:-ohlcv}@db:5432/ohlcv
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_TRADING_URL: ${ALPACA_TRADING_URL:-https://paper-api.alpaca.markets}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
